# Splunk OTel Collector 0.164.0. Only use on a private network.
# The app sends OTLP, not HEC. Inject these variables on the collector only.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  splunk_hec/traces:
    endpoint: ${env:SPLUNK_HEC_URL}
    token: ${env:SPLUNK_HEC_TOKEN}
    index: ${env:SPLUNK_TRACES_INDEX}
    source: shifty-player
    sourcetype: otel:traces
    timeout: 10s
    tls:
      insecure_skip_verify: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
  splunk_hec/metrics:
    endpoint: ${env:SPLUNK_HEC_URL}
    token: ${env:SPLUNK_HEC_TOKEN}
    index: ${env:SPLUNK_METRICS_INDEX}
    source: shifty-player
    sourcetype: otel:metrics
    timeout: 10s
    tls:
      insecure_skip_verify: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [splunk_hec/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [splunk_hec/metrics]
